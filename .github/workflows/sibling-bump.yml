# Sibling-bump CI (Phase E).
#
# Runs the full sibling build matrix whenever a PR touches the vendored
# libraries (libs/**, .gitmodules), the integration build scripts, or the
# ABI contract header — i.e. exactly the surface a submodule bump changes.
# Apply the `sibling-bump` label to re-trigger via the `labeled` event.
#
# A weekly cron runs the version probe so a new sibling release upstream
# turns this workflow red instead of sitting unnoticed (exit 2 on STALE).
#
# Deliberately NOT here: the VICE regression suite (tools/run_regression.py).
# It needs (a) the private JC-000/c64-test-harness repo, so a cross-repo
# token secret; (b) x64sc running under xvfb with the binary monitor —
# feasible on ubuntu-latest but unproven and timing-sensitive (suite
# timeouts are 30 min each, staggered VICE boots); (c) half the harness's
# 10-slot port pool. Until someone validates the harness under Actions,
# regression on sibling bumps stays a local step; this workflow gates on
# what CI can prove: the two matched toggle combinations still build, the
# two mixed ones are still refused by the Makefile guard, and the ABI
# surface still matches.
#
# History: this matrix asserted that all FOUR combinations build, which
# stopped being true at v1.0.0 when mixed configs became a hard error. It
# went unnoticed because the matrix only runs on PRs touching the paths
# below — on the weekly cron the `!= 'schedule'` guard skips it, so master
# only ever ran the probe.
name: sibling-bump

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'libs/**'
      - '.gitmodules'
      - 'tools/integration/**'
      - 'src/crypto_abi.inc'
  schedule:
    # Mondays 06:17 UTC — probe upstream for new sibling releases.
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  build-matrix:
    name: build x25519=${{ matrix.x25519 }} chacha=${{ matrix.chacha }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the matched pairs are buildable. Since v1.0.0 the Makefile
          # REFUSES mixed configs — the two archives compose via §8.0 shared
          # primitives (x25519 owns sqtab + ct_mul_8x8, chacha defers both),
          # so half a composition cannot link. `expect: refuse` inverts the
          # assertion rather than dropping those rows, which keeps the guard
          # itself under test.
          - { x25519: 0, chacha: 0, expect: build }
          - { x25519: 1, chacha: 1, expect: build }
          - { x25519: 1, chacha: 0, expect: refuse }
          - { x25519: 0, chacha: 1, expect: refuse }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65
      - name: Build (BACKEND=uci)
        if: matrix.expect == 'build'
        run: |
          make BACKEND=uci \
            USE_X25519_SIBLING=${{ matrix.x25519 }} \
            USE_CHACHA_SIBLING=${{ matrix.chacha }}
      - name: Show artifact sizes
        if: matrix.expect == 'build'
        run: ls -l build/wireguard.prg build/wireguard.map
      - name: Mixed config must be refused
        if: matrix.expect == 'refuse'
        run: |
          set +e
          make BACKEND=uci \
            USE_X25519_SIBLING=${{ matrix.x25519 }} \
            USE_CHACHA_SIBLING=${{ matrix.chacha }} > out.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: mixed sibling config built, but the Makefile guard should have refused it."
            exit 1
          fi
          if ! grep -q "USE_X25519_SIBLING and USE_CHACHA_SIBLING must match" out.log; then
            echo "FAIL: build was refused (exit $rc), but not by the mixed-config guard:"
            cat out.log
            exit 1
          fi
          echo "OK: refused by the guard as intended (exit $rc)."

  abi-drift:
    name: ABI drift gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: check_abi_drift.py against submodule pins
        run: |
          python3 tools/check_abi_drift.py \
            --abi-inc src/crypto_abi.inc \
            --x25519-inc libs/x25519/src \
            --chacha-dir libs/chacha20poly1305/src/lib

  probe-versions:
    name: probe sibling pins vs upstream
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Exit 2 (STALE) fails the scheduled run — that red X *is* the
      # notification that a sibling has released something newer.
      - name: Probe upstream versions
        run: bash tools/integration/probe_sibling_versions.sh

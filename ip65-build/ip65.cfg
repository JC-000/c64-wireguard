# ld65 linker configuration for ip65 binary blob
# Produces a raw binary (no BASIC header) starting at $2000
# for inclusion in ACME project via !binary
#
# Jump table at $2000 (JUMPTAB segment), code/data follows.
# ZP at $02-$1B (standard cc65) — time-shared with crypto via save/restore.

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0000;  # no C stack needed
    __HIMEM__:     type = weak, value = $D000;
}

# BSS base ($A000) is load-bearing and must stay in step with the consumer.
# It is NOT free real estate: it is the RAM under the C64's BASIC ROM, which
# src/boot.s banks out (`lda proc_port / and #$fe`) as its very first action
# and only restores on quit, so the whole span reads back as RAM for every
# instant ip65 can run. It is also the one $2000 window no MEMORY region in
# cfg/c64-wireguard-ip65.cfg claims. Moving it means updating, together:
#   - cfg/c64-wireguard-ip65.cfg   IP65_BSS region (the consumer reservation)
#   - src/net/ip65/ip65_blob.s     LIB_NET_IP65_BLOB_BSS_BASE (SPEC §13.7)
#   - src/boot.s                   the $A000 zero-fill loop
# The link-time asserts in ip65_blob.s fail loudly if the first two drift.
MEMORY {
    ZP:     file = "",  define = yes, start = $0002, size = $001A;
    MAIN:   file = %O,  start = $2000, size = $2000;
    BSS:    file = "",  start = $A000, size = $2000;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,   type = zp;
    JUMPTAB:   load = MAIN, type = ro;
    STARTUP:   load = MAIN, type = ro;
    LOWCODE:   load = MAIN, type = ro,  optional = yes;
    INIT:      load = MAIN, type = rw,  optional = yes;
    ONCE:      load = MAIN, type = ro,  optional = yes;
    CODE:      load = MAIN, type = ro;
    RODATA:    load = MAIN, type = ro;
    DATA:      load = MAIN, type = rw;
    BSS:       load = BSS,  type = bss;
}

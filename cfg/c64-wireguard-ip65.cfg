# c64-wireguard ld65 config — ip65/RR-Net backend
#
# Memory layout. These are the MEMORY{} regions below, not a description of
# them — the old version of this header still described the pre-ca65 ACME
# layout (MAIN_CODE, DATA_AREA, SQTAB at $7800) and named regions that had
# not existed for two releases. If you change MEMORY{}, change this with it
# or delete it; do not leave it saying something else.
#   $0801-$1FFF : LOADER       — BASIC stub, boot code, CRYPTO_RODATA and
#                                LIB_X25519_DATA
#   $2000-$32EF : NET_CODE     — the ip65 blob
#   $32F0-$7FFF : MAIN_AREA_LO — crypto + transport + session + app code,
#                                the two sibling archives, and the BSS that
#                                has to stay below the sqtab window
#   $8000-$83FF : SQTAB_HOLE   — quarter-square table, built at runtime
#   $8400-$9FFF : MAIN_AREA_HI — APP_EXTRA, APP_DATA and the x25519 cold
#                                init code (file-emitting only)
#   $8800-$9FFF : APP_BSS_OVERLAY — the SAME RAM as the top of MAIN_AREA_HI,
#                                described twice so APP_BSS can lie over the
#                                cold init code once boot has run it (#103)
#   $A000-$BFFF : IP65_BSS     — the ip65 blob's private BSS (issue #80).
#                                Measured extent is $A000-$AF3F
#                                (ip65-build/ip65-c64.map); the reservation
#                                is deliberately the whole $2000 window.
#
# IP65_BSS is a RESERVATION, not a destination. No segment loads into it and
# ld65 emits nothing for it; it exists so this cfg states, in a form the
# linker publishes as symbols, that $A000-$BFFF belongs to the blob and
# nothing of ours may grow into it. src/net/ip65/ip65_blob.s asserts the
# §13.7 equates against these symbols and against every other region here, so
# the reservation and the blob's actual link address cannot drift apart
# silently — which is precisely how #80 happened.
#
# It MUST stay file = "". A file = %O region at $A000 would append 8 KB of
# zeros to every ip65 PRG for bytes the C64 never needs loaded (boot.s zeroes
# the span itself). That is safe here only because $A000 sits ABOVE every
# file-backed region (MAIN_AREA_HI ends $9FFF): a non-file region BETWEEN two
# file-backed ones would open a gap ld65 does not pad and shift everything
# above it — the load-shift hazard the SQTAB_HOLE comment below documents.
#
# HISTORY (#80). Until this reservation existed, ip65-build/ip65.cfg linked
# the blob's BSS at $4000, inside MAIN_AREA_LO, directly on top of APP_CODE,
# APP_DATA and the chacha archive; both memory maps in this repo nonetheless
# claimed $A000-$BFFF, and nothing checked. Measured on the ethernet VICE rig,
# one DHCP exchange overwrote 733 bytes of APP_CODE (transport_encrypt /
# transport_decrypt / the replay window) and 284 bytes of
# LIB_CHACHA20_POLY1305_CODE (chacha20_block, chacha20_quarter_round,
# cc20_constants), with an ethernet broadcast MAC left sitting at $4000. It
# went unnoticed because no suite in tools/ asks for an ethernet VICE and
# every device run is BACKEND=uci — unexercised, not unexercisable. The fix
# was to RELINK the blob (§13.7: a position-linked blob moves by relink, not
# by a consumer cfg edit) and to add the reservation + asserts so the two
# sides are now checked against each other on every build.
#
# The ACME build put WG's buffers throughout $32F0-$77FF alongside code;
# we replicate that by making DATA_AREA a type=ro file-backed region and
# routing all *_BSS / *_DATA segments into it. The zero bytes land in the
# PRG file so the C64 LOAD stamps them into RAM directly — no runtime
# zero-fill needed.

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    ZP_IP65:     start = $0002, size = $001A, type = rw, define = yes;
    ZP_CRYPTO:   start = $001E, size = $0022, type = rw, define = yes;
    ZP_WIDE:     start = $0040, size = $0040, type = rw, define = yes;

    LOADADDR:    start = $07FF, size = $0002, file = %O;
    LOADER:      start = $0801, size = $17FF, file = %O, define = yes, fill = yes, fillval = $00;
    # NET_CODE holds the ip65 blob (~4.8 KB).
    NET_CODE:    start = $2000, size = $12F0, file = %O, define = yes, fill = yes, fillval = $00;
    # MAIN_AREA_LO: code + data ($32F0-$7FFF = ~20.5 KB), must stay
    # below $8000 because sqtab_init writes 256 bytes at $8000 and
    # 256 bytes at $8200 at runtime (per the sqtab_lo / sqtab_hi
    # equates in src/crypto/poly1305.s). Any data placed at $8000-$83FF
    # would be clobbered when sqtab_init fires during boot.
    MAIN_AREA_LO: start = $32F0, size = $4D10, file = %O, define = yes, fill = yes, fillval = $00;
    # $8000-$83FF is the sqtab_lo / sqtab_hi runtime window (built by
    # sqtab_init at boot). It MUST be emitted into the PRG as zero fill:
    # a PRG is a contiguous byte stream, so a file-gap here would make
    # every MAIN_AREA_HI byte load $400 low. (The pre-v1.0.0 cfg had the
    # gap and survived only because HI held nothing but zero-filled BSS —
    # zeros are shift-invariant. LIB_X25519_INIT_CODE broke that.)
    # define = yes publishes __SQTAB_HOLE_START__/_SIZE__ so
    # src/contract_asserts.s can assert this reserved window against
    # WG_SQTAB_BASE (contract §6.7 consumer mirror). Without it the cfg
    # and the equate can drift apart silently.
    SQTAB_HOLE:  start = $8000, size = $0400, file = %O, define = yes, fill = yes, fillval = $00;
    MAIN_AREA_HI: start = $8400, size = $1C00, file = %O, define = yes, fill = yes, fillval = $00;
    # APP_BSS_OVERLAY ($8800-$9FFF) DELIBERATELY OVERLAPS the top of
    # MAIN_AREA_HI. It is not a second region of RAM; it is the same RAM,
    # described twice, so that BSS can be laid over the cold init code that
    # LOAD stamps there (issue #103).
    #
    # Why this works. MAIN_AREA_HI keeps file = %O + fill = yes, so ld65
    # still emits every one of its $1C00 bytes into the PRG and LOAD still
    # zeroes the whole span. The only bytes LOAD leaves non-zero inside
    # $8800-$9FFF are LIB_X25519_INIT_CODE's own, and src/boot.s zeroes
    # exactly that span (via __LIB_X25519_INIT_CODE_LOAD__/__..._SIZE__)
    # the instant the cold init has returned. Every other APP_BSS byte is
    # zero at LOAD exactly as before. PRG size is unchanged.
    #
    # file = "" is REQUIRED. A second file-backed region overlapping the
    # first would emit both into a PRG, which is one linear byte stream
    # with one load address — the later region's bytes would land at the
    # wrong address and shift everything after them. Same hazard the
    # SQTAB_HOLE comment above documents, from the other direction.
    #
    # The $8800 boundary is a BUDGET, not a hardware fact: everything below
    # it is live file content (APP_EXTRA + APP_DATA), everything at or above
    # it is BSS. src/contract_asserts.s turns a violation into a link error
    # rather than a comment that goes stale: it checks that APP_DATA's end —
    # the end of live file content in every build configuration, including
    # USE_X25519_SIBLING=0 where there is no cold segment at all — is not
    # past $8800, and separately that the cold segment abuts APP_DATA so
    # nothing can be slipped in between. Moving the boundary trades
    # APP_EXTRA/APP_DATA space against APP_BSS space one-for-one; ld65
    # reports either side going over as an area overflow, so neither needs a
    # remembered number.
    APP_BSS_OVERLAY: start = $8800, size = $1800, file = "", define = yes;
    # IP65_BSS: the ip65 blob's private BSS, reserved here and linked there
    # (ip65-build/ip65.cfg MEMORY{} `BSS: start = $A000, size = $2000`).
    # No segment loads into it — the blob claims it at runtime, not at link
    # time — so this region is empty by design and file = "" by requirement
    # (see the header). define = yes publishes __IP65_BSS_START__/_SIZE__ for
    # the §13.7 asserts in src/net/ip65/ip65_blob.s, the same consumer-mirror
    # pattern SQTAB_HOLE uses for WG_SQTAB_BASE. Reading this RAM needs BASIC
    # ROM banked out, which src/boot.s does at `start:` and undoes only at
    # quit.
    IP65_BSS:     start = $A000, size = $2000, file = "", define = yes;
}

SEGMENTS {
    ZP_SHARED:     load = ZP_IP65,    type = zp,  optional = yes;
    ZEROPAGE:      load = ZP_CRYPTO,  type = zp,  optional = yes;
    ZP_WIDE:       load = ZP_WIDE,    type = zp,  optional = yes;

    LOADADDR:      load = LOADADDR,   type = ro;
    EXEHDR:        load = LOADER,     type = ro;
    STARTUP:       load = LOADER,     type = ro,  optional = yes;
    # BOOT_CODE is WG's own boot + net-wrapper code (was `CODE` before the
    # sibling-archive migration). It MUST stay the first code segment after
    # EXEHDR: the BASIC stub hardcodes SYS 2061 = $080D = `start:`.
    # chacha gave the bare `CODE` name back at v0.7.0 (§4 prefixes), but
    # renaming BOOT_CODE back buys nothing functional and this region has a
    # documented history of silent load-shift bugs. Leave it.
    BOOT_CODE:     load = LOADER,     type = ro;
    INIT:          load = LOADER,     type = ro,  optional = yes;

    NET_CODE:        load = NET_CODE,  type = ro;
    LOADER_OVERFLOW: load = NET_CODE,  type = ro,  optional = yes;

    # Code + RO data + BSS land in MAIN_AREA_LO ($32F0-$7FFF) to stay
    # below the $8000 sqtab runtime region. Link order: file-emitting
    # segments first, then BSS. BSS is emitted as zero bytes in the PRG
    # (region has fill=yes) so LOAD zeroes RAM for us.
    # CRYPTO_RODATA (blake2s_iv, blake2s_sigma + in-tree-only tables)
    # goes into LOADER, which has slack after the BASIC stub + boot.
    RODATA:        load = LOADER,       type = ro,  optional = yes;
    CRYPTO_RODATA: load = LOADER,       type = ro,  optional = yes;
    # LIB_X25519_DATA: the c64-x25519 archive's buffers + lookup tables
    # (3584 B). Lives in LOADER's ~4.4 KB slack (boot code ends near
    # $0EB4) because MAIN_AREA_HI cannot hold it alongside APP_BSS.
    # align=$100: data.s does .align 256 internally and carries 19
    # link-time 32-byte-alignment asserts (loud failure if dropped).
    # rw, not ro: mul_cached_a / mul_src2_buf / mul_dma_* are runtime
    # scratch.
    LIB_X25519_DATA: load = LOADER,     type = rw,  align = $100, optional = yes;
    CRYPTO_CODE:   load = MAIN_AREA_LO, type = ro,  optional = yes;
    APP_CODE:      load = MAIN_AREA_LO, type = ro,  optional = yes;
    # APP_DATA is in MAIN_AREA_HI, not here — see the MAIN_AREA_HI block
    # below. It is position-independent read-only data (message strings,
    # msg_port, ip_hdr_template, b2s_out_len, the config filename) reached
    # only by absolute address, so it has no reason to sit in the area that
    # the code has to fit in.

    # --- c64-ChaCha20-Poly1305 archive (USE_CHACHA_SIBLING=1, v0.7.0 §4 names) ---
    # v0.7.0 adopted the contract §4 segment prefixes (their issue #48), so the
    # archive no longer absorbs the bare CODE/DATA names. Measured at the pin:
    # 0 B in CODE/DATA, 8094 B in LIB_CHACHA20_POLY1305_CODE, 295 B in _DATA.
    #
    # align=$100 is a CONSTANT-TIME requirement and MUST ride with the renamed
    # segment: the lib's two nibswap LUTs are read with `lda tab,x` on secret
    # indexes and sit `.align 256` inside it (data_lib.o declares Alignment 256
    # for a 512 B contribution). ld65 only *warns* if the alignment is dropped
    # — the link still succeeds and the CT property is silently lost, with no
    # test coverage to catch it. Do not remove this without re-reading
    # libs/chacha20poly1305/src/lib/data_lib.s.
    #
    # _DATA MUST be type=rw in a file-emitting area — NEVER type=bss, and never
    # "optimised" into bss to reclaim its 295 B. Its zero bytes gate
    # poly1305_init's `sqtab_ready` check: a bss declaration emits no file
    # bytes, so sqtab_ready reads power-on garbage, sqtab_init is skipped, and
    # every Poly1305 multiplication is poisoned — silently, with no link error.
    # MAIN_AREA_LO is file-backed with fill=yes, which satisfies this.
    # Upstream states this as a consumer requirement at data_lib.s:21-25.
    LIB_CHACHA20_POLY1305_CODE: load = MAIN_AREA_LO, type = rw, align = $100, optional = yes;
    LIB_CHACHA20_POLY1305_DATA: load = MAIN_AREA_LO, type = rw, optional = yes;
    # Vestigial as of chacha v0.7.0 — nothing emits these now. Kept optional so
    # a stray object cannot land bytes in an unassigned segment.
    CODE:          load = MAIN_AREA_LO, type = rw,  optional = yes;
    DATA:          load = MAIN_AREA_LO, type = rw,  optional = yes;

    # --- c64-x25519 archive (USE_X25519_SIBLING=1, v0.10.1 §4 names) ---
    # LIB_X25519_CODE is rw, not ro: it contains runtime SMC patch sites
    # (smc_lo_addr/smc_hi_addr, reu bank patch) and mutable scratch
    # (poly_prod_lo/hi, ct_diff_raw/ct_sign_mask).
    LIB_X25519_CODE: load = MAIN_AREA_LO, type = rw, optional = yes;

    BSS:           load = MAIN_AREA_LO, type = bss, optional = yes;
    CRYPTO_BSS:    load = MAIN_AREA_LO, type = bss, align = $100, optional = yes;
    NET_BSS:       load = MAIN_AREA_LO, type = bss, optional = yes;

    # --- MAIN_AREA_HI ($8400-$9FFF), after the sqtab hole ---
    # MAIN_AREA_HI now holds ONLY file-emitting segments; the BSS goes to
    # APP_BSS_OVERLAY, which is the same RAM from $8800 up (issue #103).
    # That makes the ld65 R5 ordering rule moot here, but the ordering
    # below is still the safe one: live file content first, cold last.
    APP_EXTRA:     load = MAIN_AREA_HI, type = ro,  optional = yes;
    # APP_DATA moved here from MAIN_AREA_LO (issue #103). MAIN_AREA_LO is
    # where APP_CODE has to fit, and it was full: APP_DATA ended at $4AFC
    # with LIB_CHACHA20_POLY1305_CODE pinned at $4B00 by its align = $100,
    # leaving APP_CODE exactly 3 bytes of growth before every later segment
    # moved up a page and CRYPTO_BSS overran $7FFF by 42. Hoisting APP_DATA
    # out gives that 3 bytes back as 622. Nothing about this data is low:
    # it is read by absolute address only.
    APP_DATA:      load = MAIN_AREA_HI, type = ro,  optional = yes, define = yes;
    # LIB_X25519_INIT_CODE: the x25519 archive's cold init — sqtab_init,
    # reu_mul_init, reu_probe (826 B REU / 160 B onchip). It is dead the
    # moment src/boot.s's table build returns, so as of issue #103 this
    # repo actually reclaims it instead of only documenting that it could:
    # APP_BSS_OVERLAY lies over it, and boot.s zeroes this span through the
    # __LIB_X25519_INIT_CODE_LOAD__ / __..._SIZE__ symbols (define = yes)
    # once the last cold call has returned. That is 826 bytes of MAIN_AREA_HI
    # that no longer has to be reserved for code nothing will ever run again.
    #
    # It MUST stay the LAST file-emitting segment in this area, and it MUST
    # abut APP_DATA. Both halves matter, and the second one is the
    # non-obvious one: a file-emitting segment inserted BETWEEN APP_DATA and
    # this one is live data sitting on top of APP_BSS (measured: a 200-byte
    # probe segment there puts 105 live bytes over hs_c/hs_h and still links
    # clean). src/contract_asserts.s asserts ADJACENCY rather than mere
    # ordering for exactly that reason, so you do not have to remember this
    # comment — inserting a segment anywhere in MAIN_AREA_HI after APP_DATA
    # fails the link and the message says where to put it instead.
    LIB_X25519_INIT_CODE: load = MAIN_AREA_HI, type = rw, optional = yes, define = yes;

    # --- APP_BSS_OVERLAY ($8800-$9FFF) — the same RAM as MAIN_AREA_HI's top ---
    APP_BSS:       load = APP_BSS_OVERLAY, type = bss, optional = yes;
    APP_EXTRA_BSS: load = APP_BSS_OVERLAY, type = bss, optional = yes;
}
